# Pages CMS config — edit content at https://app.pagescms.org (log in with GitHub)
media:
  input: assets/img/posts
  output: /assets/img/posts
content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, categories]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, options: { time: true }, required: true }
      - { name: categories, label: Categories, type: string, list: true, description: "Max 2, e.g. Security, Reversing" }
      - { name: tags, label: Tags, type: string, list: true, description: "Lowercase, e.g. ctf, windows" }
      - { name: description, label: Summary, type: text }
      - { name: pin, label: Pin to top, type: boolean }
      - name: image
        label: Cover image
        type: object
        fields:
          - { name: path, label: Image, type: image }
          - { name: alt, label: Alt text, type: string }
      - { name: body, label: Content, type: rich-text }
  - name: about
    label: About page
    type: file
    path: _tabs/about.md
    fields:
      - { name: icon, label: Icon, type: string, hidden: true, default: fas fa-info-circle }
      - { name: order, label: Order, type: number, hidden: true, default: 4 }
      - { name: body, label: Content, type: rich-text }
